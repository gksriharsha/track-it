name: Release

# Every branch on its way into main gets the full set of release builds twice:
# once on the pull request, so a broken bundle is visible before the merge
# button, and once on the merge itself, where the same jobs also publish a
# GitHub release. Pull-request runs are cancelled when the branch is pushed
# again; runs on main are not, because each one produces a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the host the architecture documents were verified against. The
  # Rust android targets need r26+ for the libgcc -> libunwind change, so this
  # is pinned rather than taken from whatever the runner image ships.
  ANDROID_NDK_VERSION: "29.0.14206865"
  MACOS_TARGET: aarch64-apple-darwin
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------- metadata
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        # tauri.conf.json is the single source of truth for the version; the
        # run number keeps every merge to main distinct without asking anyone
        # to bump a file by hand.
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version"                          >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------- tests
  # On macOS because it is the only runner that compiles the cfg(target_os =
  # "macos") half of vision.rs, which is where the Apple Vision adapter and its
  # tests live. The pure-Rust core is platform-independent and comes along.
  test:
    name: Tests
    runs-on: macos-latest
    # tauri-build validates every path in tauri.conf.json's bundle.resources
    # before it will compile src-tauri at all, so even the test job needs the
    # reference database on disk.
    needs: reference-db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: usda-core-db
          path: src-tauri/resources
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc + vite. Also produces dist/, which tauri-build requires to exist
      # before the Rust side of src-tauri will compile at all.
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/core -> target
      - name: Core crate
        working-directory: crates/core
        run: cargo test --locked
      # From src-tauri so that .cargo/config.toml, and therefore the ad-hoc
      # re-signing runner, is discovered the same way it is locally.
      - name: Tauri adapter
        working-directory: src-tauri
        run: cargo test --locked

  # ---------------------------------------------------- USDA reference database
  # Built once and handed to the three platform jobs. It is a bundle resource,
  # so none of them can package without it, and rebuilding it three times over
  # would be pure waste. The cache key covers the builder, the fetcher and the
  # pinned source digests, so any change to how the file is produced makes a
  # new one.
  reference-db:
    name: Reference database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: src-tauri/resources/usda_core.db
          key: usda-core-db-${{ hashFiles('tools/build_reference_db.py', 'tools/fetch_usda.sh', 'tools/sources.sha256') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/fetch_usda.sh
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/build_reference_db.py
      - name: Check the database is non-trivial
        # A truncated or empty file would sail through bundling and only fail
        # on a user's device, so the size is asserted here instead.
        run: |
          bytes=$(wc -c < src-tauri/resources/usda_core.db)
          echo "usda_core.db is $bytes bytes"
          test "$bytes" -gt 20000000
      - uses: actions/upload-artifact@v7
        with:
          name: usda-core-db
          path: src-tauri/resources/usda_core.db
          retention-days: 1

  # ----------------------------------------------------------------- Android
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [meta, test, reference-db]
    outputs:
      # Whether the APK this run produced can actually be installed. Read by
      # the release job so the notes state what happened rather than what
      # might have.
      signed: ${{ steps.collect.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: usda-core-db
          path: src-tauri/resources
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install pinned NDK
        run: |
          sdkmanager --install "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: Configure release signing
        # Absent secrets are not an error: the build then produces an unsigned
        # release APK, which is still a useful artifact to inspect. Only a
        # signed one can be installed as an update over an existing install.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the release APK will be unsigned."
            exit 0
          fi

          # Half a configuration is not a configuration.
          #
          # All four secrets are needed together. With only the keystore set,
          # this wrote a properties file with empty passwords, and the failure
          # surfaced four and a half minutes later inside gradle as
          # "keystore password was incorrect" — which points at the password
          # being WRONG rather than at three secrets never having been added.
          # Someone who has just pasted a key would reasonably conclude their
          # key was bad and go and regenerate it.
          missing=""
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but these are not:$missing. \
          Signing needs all four; see docs/ci.md. Remove the keystore secret to go back to \
          publishing an unsigned build."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/upload.jks
          ks=src-tauri/gen/android/upload.jks

          # Three separate things can be wrong here and gradle reports them all
          # as "keystore password was incorrect" several minutes into the build.
          # Each is checked on its own so the message names the actual cause.
          #
          # Alias names are printed on failure. They are not secret — an alias
          # is readable out of the signature block of any APK signed with the
          # key — and knowing the keystore calls it `key0` rather than `upload`
          # is usually the whole answer. Passwords are never printed.
          if ! keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open this keystore. It is the \
          STORE password you typed first at keytool -genkeypair, which is not necessarily the \
          key password. If the value has a \$ or a backtick in it, check it survived the paste."
            exit 1
          fi
          if ! keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore opened, but it has no alias named '$KEY_ALIAS'. \
          Aliases it does contain: $(keytool -list -keystore "$ks" \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | paste -sd' ' -)"
            exit 1
          fi
          # The key password, where it is a separate thing at all.
          #
          # PKCS12 has been keytool's default store type since JDK 9, and it
          # cannot hold a per-key password distinct from the store's — keytool
          # accepts any -keypass against one. So on a PKCS12 keystore this
          # check can only pass, and ANDROID_KEY_PASSWORD must equal
          # ANDROID_KEYSTORE_PASSWORD or gradle will disagree with it. Said out
          # loud rather than left as a silent no-op, because a green check that
          # cannot fail is worse than no check.
          if keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
               | grep -q "Keystore type: PKCS12"; then
            if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
              echo "::warning::This is a PKCS12 keystore, where the key password is the store \
          password. ANDROID_KEY_PASSWORD differs from ANDROID_KEYSTORE_PASSWORD and will be \
          ignored; set them to the same value if the build disagrees."
            fi
          elif ! keytool -certreq -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_PASSWORD does not unlock the key '$KEY_ALIAS'. If you \
          pressed Return at keytool's key-password prompt it is the same as the store password."
            exit 1
          fi
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build
        run: pnpm tauri android build --apk --target aarch64 --split-per-abi --ci
      - name: Collect
        id: collect
        # The signature is CHECKED, not inferred from the filename, and the
        # published name says which it is.
        #
        # Before this, an unsigned APK was copied to
        # `TrackIt-<version>-android-arm64.apk` and offered on the release page
        # under a name that gave no hint Android would refuse to install it.
        # The only notice was a `::warning::` in a job log, which is not where
        # anyone downloading a build is looking. Builds 3, 5 and 7 all shipped
        # that way.
        #
        # Deliberately does NOT fail the job. `Android APK` is a required check,
        # so failing here would make `main` unmergeable until the secrets exist
        # — turning a distribution problem into a development one. An honest
        # name is enough: it cannot be mistaken for a release build, and it
        # stays a useful artifact to inspect.
        run: |
          mkdir -p out
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | head -1)
          test -n "$apk" || { echo "no release APK produced"; exit 1; }

          base="TrackIt-${{ needs.meta.outputs.version }}-android-arm64"
          hint="Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; see docs/ci.md."

          # Not finding apksigner is its own state, and not a reason to fail a
          # required check. Fall back to what gradle called the file, and say
          # that the signature was assumed rather than verified.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found; falling back to the filename to judge signing."
            case "$(basename "$apk")" in
              *unsigned*) signed=false ;;
              *)          signed=true  ;;
            esac
          elif "$apksigner" verify "$apk" >/dev/null 2>&1; then
            signed=true
            "$apksigner" verify --print-certs "$apk" | head -2
          else
            signed=false
          fi

          if [ "$signed" = true ]; then
            name="$base.apk"
          else
            name="$base-UNSIGNED.apk"
            echo "::warning::This APK is unsigned; Android will refuse to install it. $hint"
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

          cp "$apk" "out/$name"
          ls -la out
      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/upload.jks src-tauri/gen/android/keystore.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/*.apk

  # ------------------------------------------------------------------- macOS
  macos:
    name: macOS app
    runs-on: macos-latest
    needs: [meta, test, reference-db]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: usda-core-db
          path: src-tauri/resources
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.MACOS_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos
      - name: Build
        # With no Developer ID secrets the bundle keeps tauri.conf.json's
        # signingIdentity of "-", i.e. ad-hoc: it runs on the machine that built
        # it and on the author's own Mac after a right-click-Open, but Gatekeeper
        # will refuse it on someone else's. Supplying the three APPLE_* secrets
        # switches the same build to a signed, notarised bundle.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset secret arrives as an empty string, not as an absent
          # variable, and Tauri reads a defined-but-empty APPLE_CERTIFICATE as
          # "sign with this" — then dies inside `security import` with
          # "One or more parameters passed to a function were not valid".
          # Dropping the empties is what lets the ad-hoc identity in
          # tauri.conf.json apply.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::No APPLE_SIGNING_IDENTITY secret; the macOS bundle is ad-hoc signed and Gatekeeper will block it on other Macs."
          fi
          pnpm tauri build --target "$MACOS_TARGET" --bundles app,dmg
      - name: Collect
        run: |
          mkdir -p out
          bundle="src-tauri/target/$MACOS_TARGET/release/bundle"
          # ditto, not zip: a .app is a tree of symlinks and executable bits that
          # upload-artifact would otherwise flatten into something unlaunchable.
          ditto -c -k --keepParent "$bundle/macos/TrackIt.app" \
            "out/TrackIt-${{ needs.meta.outputs.version }}-macos-aarch64.app.zip"
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -1)
          test -n "$dmg" || { echo "no dmg produced"; exit 1; }
          cp "$dmg" "out/TrackIt-${{ needs.meta.outputs.version }}-macos-aarch64.dmg"
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: out/*

  # --------------------------------------------------------------------- iOS
  # An installable .ipa cannot be produced without an Apple Developer Program
  # membership: the export step needs a distribution certificate and a
  # provisioning profile, and no flag substitutes for them. So this job always
  # does the part that needs no account — compiling the whole Rust side for a
  # real device target, which is where an iOS regression would actually show up
  # — and additionally produces and uploads an .ipa once the secrets exist.
  ios:
    name: iOS app
    runs-on: macos-latest
    needs: [meta, test, reference-db]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: usda-core-db
          path: src-tauri/resources
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
      - name: Compile for device
        working-directory: src-tauri
        run: cargo build --locked --release --lib --target aarch64-apple-ios
      - name: Detect signing material
        id: signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT: ${{ secrets.IOS_CERTIFICATE }}
        run: |
          if [ -n "$TEAM_ID" ] && [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain the gap
        if: steps.signing.outputs.available != 'true'
        run: |
          {
            echo "### iOS: compiled, not packaged"
            echo
            echo "\`aarch64-apple-ios\` builds cleanly, so the Rust side is iOS-ready."
            echo "No \`.ipa\` was produced: that needs an Apple Developer Program"
            echo "membership and these repository secrets —"
            echo
            echo "- \`APPLE_TEAM_ID\`"
            echo "- \`IOS_CERTIFICATE\` (base64 of a distribution \`.p12\`)"
            echo "- \`IOS_CERTIFICATE_PASSWORD\`"
            echo "- \`IOS_MOBILE_PROVISION\` (base64 of the provisioning profile)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'debugging' }}
        run: |
          # A throwaway keychain, unlocked for this run only, so the certificate
          # never touches the runner's login keychain.
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$IOS_MOBILE_PROVISION" | base64 -d > "$profiles/trackit.mobileprovision"

          # gen/apple is not committed, so the Xcode project is generated fresh.
          pnpm tauri ios init
          pnpm tauri ios build --ci --export-method "$EXPORT_METHOD"

          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Collect
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p out
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$ipa" || { echo "no ipa produced"; exit 1; }
          cp "$ipa" "out/TrackIt-${{ needs.meta.outputs.version }}-ios.ipa"
          ls -la out
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.available == 'true'
        with:
          name: ios-app
          path: out/*.ipa

  # ----------------------------------------------------------------- release
  # Only on the merge itself. A pull-request run stops at the artifacts above,
  # which is the point: the same bundles are proven before the merge and
  # published after it.
  #
  # Android and macOS are hard requirements. iOS is not, deliberately: it has
  # never been built here, and a platform that has yet to produce a single
  # bundle should not be able to withhold two that work. A failing ios job
  # still fails the run and is still visible on the commit; it just does not
  # take the release with it. Make it a hard requirement too once it has been
  # green a few times.
  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [meta, android, macos, ios]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.android.result == 'success'
      && needs.macos.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: macos-app
          path: assets
      # Absent until the Apple Developer secrets are configured; the rest of
      # the release should still publish without it.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ios-app
          path: assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          cat > notes.md <<'EOF'
          Built on merge to main.

          | Bundle | Signing |
          |---|---|
          | `.dmg` / `.app.zip` (macOS, Apple Silicon) | Ad-hoc unless Developer ID secrets are set. Right-click → Open the first time. |
          | `.apk` (Android, arm64-v8a) | ANDROID_SIGNING |
          | `.ipa` (iOS) | Present only when the Apple Developer secrets are set. |
          EOF
          # Substituted rather than written inline so the heredoc can stay
          # quoted: an unquoted one would expand the backticks around the
          # bundle names as commands.
          if [ "${{ needs.android.outputs.signed }}" = "true" ]; then
            android_note="Signed with the upload key."
          else
            android_note="**Unsigned — Android will refuse to install it.** The file is named \`-UNSIGNED\` for that reason. Set the four \`ANDROID_*\` secrets to sign it; see \`docs/ci.md\`."
          fi
          sed -i "s|ANDROID_SIGNING|$android_note|" notes.md
          echo "" >> notes.md
          echo "Commit: ${{ github.sha }}" >> notes.md
          gh release create "${{ needs.meta.outputs.tag }}" \
            --title "TrackIt ${{ needs.meta.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            assets/*
