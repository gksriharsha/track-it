<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3c6449; text-decoration: none; } a:hover { color: #4a7c59; }
    .num { font-family: Newsreader, Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8378; font-weight: 600; }
    /* 48px rows rather than Material's 40: this drawer is the only way to reach
       eleven places, so the extra thumb room is worth the height. */
    .row { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 16px; border-radius: 999px; width: 100%; border: none; text-align: left; cursor: pointer; font: inherit; }
    .row:active { transform: scale(0.985); }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #fbfaf8; color: #1c1a17; overflow: hidden;">

  <!-- Safe area for the real Android status bar. Nothing is drawn here on
       purpose: the OS paints its own clock and battery over this strip. -->
  <div style="height: 44px;"></div>

  <div style="padding: 0 20px;">

    <!-- The menu button takes the place the wordmark had to itself. 44px so it
         clears the touch-target floor, and the brand stays quiet beside it
         rather than competing with the screen title. -->
    <div style="display: flex; align-items: center; gap: 6px; height: 44px; margin-left: -10px;">
      <button onClick="{{ toggle }}" aria-label="Open the menu" style="width: 44px; height: 44px; border: none; background: none; border-radius: 999px; display: grid; place-items: center; color: #57524a; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="#4a7c59" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="42 14" />
      </svg>
      <span style="font-size: 12px; letter-spacing: 0.04em; color: #8a8378; font-weight: 600;">BIOBALANCE</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px;">
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em;">{{ title }}</h1>
      <div style="display: flex; align-items: center; background: #ffffff; border: 1px solid #e8e4dd; border-radius: 999px; padding: 2px;">
        <button style="width: 34px; height: 34px; border: none; background: none; border-radius: 999px; display: grid; place-items: center; color: #57524a;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <span style="font-size: 12px; font-weight: 600; color: #57524a; padding: 0 4px; letter-spacing: 0.01em;">Sat 5</span>
        <button style="width: 34px; height: 34px; border: none; background: none; border-radius: 999px; display: grid; place-items: center; color: #cfc9bf;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </div>
    </div>

    <div style="margin-top: 26px; display: flex; align-items: baseline; gap: 10px;">
      <span class="num" style="font-size: 72px; line-height: 0.86; font-weight: 500;">1,840</span>
      <span style="font-size: 15px; color: #8a8378;">kcal</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px;">
      <span style="font-size: 13px; color: #57524a;">660 left of 2,500</span>
      <span style="font-size: 13px; color: #8a8378;">·</span>
      <span style="font-size: 13px; color: #8a8378;">estimated for you</span>
    </div>

    <div style="height: 6px; border-radius: 999px; background: #e8e4dd; margin-top: 16px; overflow: hidden;">
      <div style="width: 73.6%; height: 100%; background: #4a7c59; border-radius: 999px;"></div>
    </div>

    <div class="cap" style="margin-top: 30px;">What you ate</div>

    <div style="margin-top: 12px; background: #ffffff; border: 1px solid #e8e4dd; border-radius: 16px; padding: 4px 16px;">
      <div style="display: flex; align-items: center; gap: 12px; height: 58px; border-bottom: 1px solid #e8e4dd;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14.5px; font-weight: 500;">Rajma masala</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">lunch · 300 g from the pot</span>
        </span>
        <span class="num" style="font-size: 16px; color: #57524a;">412</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 58px;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14.5px; font-weight: 500;">Rice, cooked</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">lunch · 180 g weighed</span>
        </span>
        <span class="num" style="font-size: 16px; color: #57524a;">234</span>
      </div>
    </div>

    <div class="cap" style="margin-top: 26px;">Worth a look</div>
    <div style="margin-top: 12px; display: flex; gap: 10px;">
      <div style="flex: 1; background: #ffffff; border: 1px solid #e8e4dd; border-radius: 16px; padding: 14px 14px 12px;">
        <span class="num" style="font-size: 22px; font-weight: 500;">7.2</span>
        <span style="font-size: 11px; color: #8a8378;"> mg</span>
        <span style="display: block; font-size: 12px; color: #57524a; margin-top: 2px;">Iron</span>
        <span style="display: block; font-size: 11px; color: #8a8378;">90% of 8 mg</span>
      </div>
      <div style="flex: 1; background: #ffffff; border: 1px solid #e8e4dd; border-radius: 16px; padding: 14px 14px 12px;">
        <span class="num" style="font-size: 22px; font-weight: 500;">1.4</span>
        <span style="font-size: 11px; color: #8a8378;"> µg</span>
        <span style="display: block; font-size: 12px; color: #57524a; margin-top: 2px;">B12</span>
        <span style="display: block; font-size: 11px; color: #8a8378;">58% of 2.4 µg</span>
      </div>
    </div>
  </div>

  <!-- Add food sits above the bar, in the corner the right thumb rests in. It
       is the app's one dominant action and the only reason to open the app in a
       hurry, so it never moves and never hides. -->
  <button style="position: absolute; right: 20px; bottom: 92px; width: 56px; height: 56px; border: none; border-radius: 999px; background: #4a7c59; color: #ffffff; display: grid; place-items: center; box-shadow: 0 4px 14px -2px rgba(74,124,89,0.45), 0 2px 4px rgba(28,26,23,0.10); cursor: pointer;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <!-- Three shortcuts, not five, and not eleven. These are the screens a food
       diary is opened for hourly; everything else lives in the drawer, which
       also still lists these three, so the menu is a complete map rather than
       an overflow bin. Three slots make each target 130px wide instead of 78 —
       the bar got MORE thumb-friendly by losing two items, not less. -->
  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); border-top: 1px solid #e8e4dd; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 4px 18px;">
    <sc-for list="{{ bar }}" as="tab" hint-placeholder-count="3">
      <button onClick="{{ tab.pick }}" style="{{ tab.tabStyle }}">
        <span style="{{ tab.pillStyle }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ tab.stroke }}" stroke-linecap="round" stroke-linejoin="round">
            <path d="{{ tab.d1 }}" />
            <path d="{{ tab.d2 }}" />
          </svg>
        </span>
        <span style="{{ tab.labelStyle }}">{{ tab.label }}</span>
      </button>
    </sc-for>
  </nav>

  <!-- Scrim, tinted with the app's own ink rather than pure black. It stays in
       the DOM so opening and closing transition instead of cutting. -->
  <div onClick="{{ close }}" style="{{ scrimStyle }}"></div>

  <!-- 300px of a 390px screen leaves a live sliver of the page behind it, which
       is what says the drawer is over this screen rather than being a screen of
       its own. -->
  <aside style="{{ drawerStyle }}">

    <div style="height: 44px; flex: none;"></div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 20px 0; flex: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="#4a7c59" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="42 14" />
      </svg>
      <span style="font-size: 12.5px; letter-spacing: 0.04em; color: #57524a; font-weight: 600;">BIOBALANCE</span>
    </div>

    <div style="padding: 14px 10px 24px; overflow-y: auto; flex: 1; min-height: 0;">
      <!-- One flat list, headings included as rows: a single sc-for over
           entries that are either a group label or a destination. Nesting one
           sc-for inside another is not part of the documented format, and a
           list that silently fails to render is the worst outcome here. -->
      <sc-for list="{{ rows }}" as="item" hint-placeholder-count="11">
        <sc-if value="{{ item.isHeading }}" hint-placeholder-val="{{ false }}">
          <div class="cap" style="padding: 12px 16px 4px;">{{ item.label }}</div>
        </sc-if>
        <sc-if value="{{ item.isDest }}" hint-placeholder-val="{{ true }}">
          <button class="row" onClick="{{ item.pick }}" style="{{ item.rowStyle }}">
            <span style="display: grid; place-items: center; width: 20px; height: 20px; flex: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ item.stroke }}" stroke-linecap="round" stroke-linejoin="round">
                <path d="{{ item.d1 }}" />
                <path d="{{ item.d2 }}" />
              </svg>
            </span>
            <span style="{{ item.labelStyle }}">{{ item.label }}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>
  </aside>
</div>
</x-dc>
<script data-dc-script data-props='{
  "$preview": { "width": 390, "height": 844 },
  "startOpen": { "editor": "boolean", "default": false, "section": "Drawer" },
  "accent": { "editor": "color", "default": "#4a7c59", "options": ["#4a7c59", "#3c6449", "#8a5a3a", "#4a6a7c"], "section": "Drawer" }
}'>
/**
 * CONSIDERED, NOT CHOSEN — a left drawer plus three shortcuts kept on the
 * bottom edge.
 *
 * This was my recommendation and the user overruled it: they had asked for the
 * menu to come off the bottom edge in the first place, and keeping a bar there
 * reinstated what they had rejected. The reasoning below is left intact as the
 * record of the argument, not as a proposal.
 *
 * Why both, rather than the drawer alone. The bottom third of a phone is the
 * only comfortable one-thumb zone and the top-left corner is the hardest pixel
 * on the screen to reach, so what goes behind the hamburger should be what you
 * touch weekly — not Today, which you touch at every meal. The drawer earns its
 * place a different way: this app has ELEVEN destinations, and the six that a
 * five-slot bar could not hold were costing a Library hub screen you had to
 * walk THROUGH to reach a recipe. The drawer swallows that hub.
 *
 * So the split is by frequency, not by category: hourly screens on the edge,
 * everything — those three included — in the drawer, so the menu reads as a
 * complete map rather than an overflow bin.
 *
 * Every icon is two path strings rather than injected markup, because a hole
 * binds a value and cannot carry HTML. An icon needing one path leaves the
 * second empty, which renders nothing.
 */
class Component extends DCLogic {
  /** The real destination inventory, read off the app's own routes. */
  groups() {
    return [
      {
        heading: null,
        items: [
          { id: 'today', label: 'Today',
            d1: 'M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', d2: '' },
          { id: 'nutrients', label: 'Nutrients',
            d1: 'M5 20V10M12 20V4M19 20v-7', d2: '' },
          { id: 'history', label: 'History',
            d1: 'M6 5h12a2.5 2.5 0 0 1 2.5 2.5v11a2.5 2.5 0 0 1-2.5 2.5H6a2.5 2.5 0 0 1-2.5-2.5v-11A2.5 2.5 0 0 1 6 5z',
            d2: 'M3.5 9.5h17M8 3v4M16 3v4' },
        ],
      },
      {
        heading: 'Your library',
        items: [
          { id: 'recipes', label: 'Recipes',
            d1: 'M5 6.5A1.5 1.5 0 0 1 6.5 5H18v14H6.5A1.5 1.5 0 0 1 5 17.5z', d2: 'M18 5v14' },
          { id: 'foods', label: 'Your foods',
            d1: 'M7 3.5h10a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z',
            d2: 'M8.5 8.5h7M8.5 12h7M8.5 15.5h4' },
          { id: 'supplements', label: 'Supplements',
            d1: 'M6.5 8.5h11a3.5 3.5 0 0 1 0 7h-11a3.5 3.5 0 0 1 0-7z', d2: 'M12 8.5v7' },
          { id: 'vessels', label: 'Vessels',
            d1: 'M6 9h12l-1 9.5a2 2 0 0 1-2 1.8H9a2 2 0 0 1-2-1.8z', d2: 'M4.5 9h15' },
          { id: 'bottles', label: 'Bottles',
            d1: 'M10 3h4v3.2l2 2.6V20a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8.8l2-2.6z', d2: 'M8 13.5h8' },
        ],
      },
      {
        heading: 'You',
        items: [
          { id: 'profile', label: 'Profile & targets',
            d1: 'M12 5.1a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8z', d2: 'M5.5 20a6.5 6.5 0 0 1 13 0' },
          { id: 'import', label: 'Import a spreadsheet',
            d1: 'M12 4v10M8.5 10.5L12 14l3.5-3.5', d2: 'M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2' },
          { id: 'settings', label: 'Settings',
            d1: 'M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z',
            d2: 'M12 3v2.5M12 18.5V21M4.2 7.5l2.2 1.3M17.6 15.2l2.2 1.3M4.2 16.5l2.2-1.3M17.6 8.8l2.2-1.3' },
        ],
      },
    ];
  }

  /** What the screen behind the drawer calls itself. */
  titleFor(id) {
    const titles = {
      today: 'Today', nutrients: 'Nutrients', history: 'History',
      recipes: 'Recipes', foods: 'Your foods', supplements: 'Supplements',
      vessels: 'Vessels', bottles: 'Bottles', profile: 'Profile',
      import: 'Import', settings: 'Settings',
    };
    return titles[id] || 'Today';
  }

  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent || '#4a7c59';
    const accentInk = '#3c6449';
    // Initial state is derived rather than set in a constructor, so the tweak
    // can seed it and the first render never runs ahead of the props.
    const open = st.open === undefined ? this.props.startOpen !== false : st.open;
    const dest = st.dest || 'today';

    // Material's emphasized-decelerate curve. The scrim runs slightly faster
    // than the panel, so the page behind is already dimming as the drawer lands.
    const drawerStyle = [
      'position: absolute; top: 0; bottom: 0; left: 0; width: 300px',
      'background: #ffffff; border-right: 1px solid #e8e4dd',
      'box-shadow: 4px 0 24px -6px rgba(28,26,23,0.18)',
      'display: flex; flex-direction: column',
      'transition: transform 240ms cubic-bezier(0.05, 0.7, 0.1, 1)',
      open ? 'transform: translateX(0)' : 'transform: translateX(-101%)',
    ].join('; ');

    const scrimStyle = [
      'position: absolute; inset: 0; background: #1c1a17',
      'transition: opacity 200ms ease-out',
      open
        ? 'opacity: 0.32; pointer-events: auto; cursor: pointer'
        : 'opacity: 0; pointer-events: none',
    ].join('; ');

    // Flattened to one list so the template needs a single sc-for: each entry
    // is either a group label or a destination, and the template branches on
    // which. `isHeading` and `isDest` are separate flags rather than one
    // negated in the template, because a hole is a lookup and cannot negate.
    const rows = [];
    this.groups().forEach((group) => {
      if (group.heading) {
        rows.push({
          isHeading: true, isDest: false, label: group.heading,
          d1: '', d2: '', stroke: 1.9, rowStyle: '', labelStyle: '', pick: null,
        });
      }
      group.items.forEach((item) => {
        const on = item.id === dest;
        rows.push({
          isHeading: false,
          isDest: true,
          d1: item.d1,
          d2: item.d2,
          label: item.label,
          stroke: on ? 2 : 1.9,
          // Selection is the accent plus a soft wash, never an inverted pill —
          // the rule the bottom bar already followed, widened to a whole row.
          rowStyle: on
            ? 'background: #edf3ee; color: ' + accent
            : 'background: none; color: #57524a',
          labelStyle: on
            ? 'font-size: 14.5px; font-weight: 600; color: ' + accent
            : 'font-size: 14.5px; font-weight: 500; color: #1c1a17',
          // Tapping a destination selects it AND closes: a modal drawer left
          // open would be hiding the screen you just asked for.
          pick: () => this.setState({ dest: item.id, open: false }),
        });
      });
    });

    // The bar's three shortcuts, decorated from the same source as the drawer
    // so a label can never disagree between the two.
    const hot = ['today', 'nutrients', 'history'];
    const flat = [];
    this.groups().forEach((g) => g.items.forEach((i) => flat.push(i)));
    const bar = hot.map((id) => {
      const item = flat.filter((i) => i.id === id)[0];
      // No bar item lights up while you are on one of the other eight screens.
      // Leaving all three grey is the honest state: you are somewhere the bar
      // does not go, and faking a selection would misreport where you are.
      const on = item.id === dest;
      return {
        d1: item.d1,
        d2: item.d2,
        label: item.label,
        stroke: on ? 2 : 1.9,
        tabStyle: [
          'display: flex; flex-direction: column; align-items: center; gap: 3px',
          'min-height: 52px; padding-top: 6px; border: none; background: none',
          'cursor: pointer; font: inherit',
          on ? 'color: ' + accentInk : 'color: #8a8378',
        ].join('; '),
        // The same 44x26 wash pill the bar already used for selection.
        pillStyle: on
          ? 'display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; background: #edf3ee'
          : 'display: grid; place-items: center; width: 44px; height: 26px',
        labelStyle: on
          ? 'font-size: 10.5px; font-weight: 600'
          : 'font-size: 10.5px; font-weight: 500',
        pick: () => this.setState({ dest: item.id, open: false }),
      };
    });

    return {
      title: this.titleFor(dest),
      rows: rows,
      bar: bar,
      drawerStyle: drawerStyle,
      scrimStyle: scrimStyle,
      toggle: () => this.setState({ open: !open, dest: dest }),
      close: () => this.setState({ open: false, dest: dest }),
    };
  }
}
</script>
</body>
</html>
