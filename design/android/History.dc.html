<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3c6449; text-decoration: none; } a:hover { color: #4a7c59; }
    .num { font-family: Newsreader, Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8378; font-weight: 600; }
    .wd { font-size: 10px; text-align: center; color: #a89f92; font-weight: 600; letter-spacing: 0.04em; }
    .day { position: relative; min-height: 46px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; padding-top: 5px; gap: 2px; }
    .seg { height: 3px; border-radius: 999px; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 1000px; background: #fbfaf8; color: #1c1a17; overflow: hidden;">
  <div style="height: 44px;"></div>

  <div style="padding: 0 20px;">
    <h1 style="margin: 20px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em;">History</h1>
    <p style="margin: 6px 0 0; font-size: 13px; color: #8a8378;">Pick a day, or average a period</p>

    <!-- Calendar -->
    <div style="background: #ffffff; border-radius: 20px; padding: 16px 16px 14px; margin-top: 18px; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button style="width: 34px; height: 34px; border-radius: 999px; background: #f4f2ee; display: grid; place-items: center; color: #57524a;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <span style="flex: 1; text-align: center; font-size: 15px; font-weight: 600;">September 2026</span>
        <button style="width: 34px; height: 34px; border-radius: 999px; background: #f7f5f1; display: grid; place-items: center; color: #cfc9bf;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-top: 12px;">
        <div class="wd">M</div><div class="wd">T</div><div class="wd">W</div><div class="wd">T</div><div class="wd">F</div><div class="wd">S</div><div class="wd">S</div>

        <div class="day"></div><div class="day"></div>
        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">1</span></div>
        <div class="day" style="background: #f7f5f1;">
          <span class="num" style="font-size: 12px;">2</span>
          <span class="num" style="font-size: 9px; color: #8a8378;">1980</span>
          <span style="display: flex; gap: 1px; width: 24px;"><span class="seg" style="flex: 2; background: #4a7c59;"></span><span class="seg" style="flex: 1; background: #d6d1c8;"></span></span>
        </div>
        <div class="day" style="background: #f7f5f1;">
          <span class="num" style="font-size: 12px;">3</span>
          <span class="num" style="font-size: 9px; color: #8a8378;">2240</span>
          <span style="display: flex; gap: 1px; width: 24px;"><span class="seg" style="flex: 1; background: #4a7c59;"></span><span class="seg" style="flex: 1; background: #c9803f;"></span></span>
        </div>
        <div class="day" style="background: #f7f5f1;">
          <span class="num" style="font-size: 12px;">4</span>
          <span class="num" style="font-size: 9px; color: #8a8378;">2110</span>
          <span style="display: flex; gap: 1px; width: 24px;"><span class="seg" style="flex: 3; background: #4a7c59;"></span></span>
        </div>
        <!-- Today: an accent ring, not a filled black square. -->
        <div class="day" style="background: #f7f5f1; box-shadow: inset 0 0 0 1.5px #4a7c59;">
          <span class="num" style="font-size: 12px; font-weight: 600;">5</span>
          <span class="num" style="font-size: 9px; color: #8a8378;">1840</span>
          <span style="display: flex; gap: 1px; width: 24px;"><span class="seg" style="flex: 2; background: #4a7c59;"></span><span class="seg" style="flex: 1; background: #a8563c;"></span></span>
        </div>

        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">6</span></div>
        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">7</span></div>
        <!-- A day holding only a supplement: its own mark, never a
             near-empty energy bar that would read as "you barely ate". -->
        <div class="day" style="background: #f7f5f1;">
          <span class="num" style="font-size: 12px;">8</span>
          <span style="width: 5px; height: 5px; border-radius: 999px; background: #4a7c59; opacity: 0.55; margin-top: 3px;"></span>
        </div>
        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">9</span></div>
        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">10</span></div>
        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">11</span></div>
        <div class="day"><span class="num" style="font-size: 12px; color: #a89f92;">12</span></div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1eee8; font-size: 10.5px; color: #8a8378;">
        <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 3px; border-radius: 999px; background: #4a7c59;"></span>Home</span>
        <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 3px; border-radius: 999px; background: #c9803f;"></span>Ordered</span>
        <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 3px; border-radius: 999px; background: #a8563c;"></span>Ate out</span>
        <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 3px; border-radius: 999px; background: #d6d1c8;"></span>Not recorded</span>
      </div>
    </div>

    <!-- Period selector -->
    <div style="display: flex; background: #f0ede7; border-radius: 999px; padding: 3px; margin-top: 18px;">
      <button style="flex: 1; min-height: 36px; border-radius: 999px; color: #8a8378; font-size: 12.5px; font-weight: 500;">7 days</button>
      <button style="flex: 1; min-height: 36px; border-radius: 999px; background: #ffffff; color: #1c1a17; font-size: 12.5px; font-weight: 600; box-shadow: 0 1px 2px rgba(28,26,23,0.06);">30 days</button>
      <button style="flex: 1; min-height: 36px; border-radius: 999px; color: #8a8378; font-size: 12.5px; font-weight: 500;">Month</button>
      <button style="flex: 1; min-height: 36px; border-radius: 999px; color: #8a8378; font-size: 12.5px; font-weight: 500;">Custom</button>
    </div>

    <!-- Cuisine frequency -->
    <div style="background: #ffffff; border-radius: 20px; padding: 18px; margin-top: 16px; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Cuisine</h2>
        <span style="font-size: 12px; color: #8a8378;">by dish, 30 days</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 14px;">
        <span style="display: grid; grid-template-columns: 88px 1fr 52px; align-items: center; gap: 10px;">
          <span style="font-size: 13px;">South Indian</span>
          <span style="height: 7px; background: #f0ede7; border-radius: 999px; overflow: hidden;"><span style="display: block; width: 100%; height: 100%; background: #4a7c59; border-radius: 999px;"></span></span>
          <span class="num" style="font-size: 13px; text-align: right;">31<span style="color: #a89f92; font-size: 11px;"> 44%</span></span>
        </span>
        <span style="display: grid; grid-template-columns: 88px 1fr 52px; align-items: center; gap: 10px;">
          <span style="font-size: 13px;">North Indian</span>
          <span style="height: 7px; background: #f0ede7; border-radius: 999px; overflow: hidden;"><span style="display: block; width: 55%; height: 100%; background: #4a7c59; border-radius: 999px;"></span></span>
          <span class="num" style="font-size: 13px; text-align: right;">17<span style="color: #a89f92; font-size: 11px;"> 24%</span></span>
        </span>
        <span style="display: grid; grid-template-columns: 88px 1fr 52px; align-items: center; gap: 10px;">
          <span style="font-size: 13px;">Indo-Chinese</span>
          <span style="height: 7px; background: #f0ede7; border-radius: 999px; overflow: hidden;"><span style="display: block; width: 29%; height: 100%; background: #4a7c59; border-radius: 999px;"></span></span>
          <span class="num" style="font-size: 13px; text-align: right;">9<span style="color: #a89f92; font-size: 11px;"> 13%</span></span>
        </span>
        <!-- Untagged is shown, never folded away: how much you have not said
             is part of what the chart is showing. -->
        <span style="display: grid; grid-template-columns: 88px 1fr 52px; align-items: center; gap: 10px;">
          <span style="font-size: 13px; color: #8a8378;">Not recorded</span>
          <span style="height: 7px; background: #f0ede7; border-radius: 999px; overflow: hidden;"><span style="display: block; width: 42%; height: 100%; background: #d6d1c8; border-radius: 999px;"></span></span>
          <span class="num" style="font-size: 13px; text-align: right; color: #8a8378;">13<span style="color: #a89f92; font-size: 11px;"> 19%</span></span>
        </span>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #f1eee8;">
        <span style="flex: 1; text-align: center;">
          <span class="num" style="display: block; font-size: 20px; font-weight: 500;">48</span>
          <span style="font-size: 11px; color: #8a8378;">made at home</span>
        </span>
        <span style="flex: 1; text-align: center;">
          <span class="num" style="display: block; font-size: 20px; font-weight: 500;">14</span>
          <span style="font-size: 11px; color: #8a8378;">ordered in</span>
        </span>
        <span style="flex: 1; text-align: center;">
          <span class="num" style="display: block; font-size: 20px; font-weight: 500;">8</span>
          <span style="font-size: 11px; color: #8a8378;">ate out</span>
        </span>
      </div>
    </div>
  </div>

  <button style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 999px; background: #4a7c59; color: #ffffff; display: grid; place-items: center; box-shadow: 0 4px 14px -2px rgba(74,124,89,0.45), 0 2px 4px rgba(28,26,23,0.10);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); border-top: 1px solid #e8e4dd; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 18px;">
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">Today</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">Nutrients</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #3c6449;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; background: #edf3ee;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 9.5h17M8 3v4M16 3v4" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 600;">History</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z" /><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9" /><path d="M18 7l2.4.6a1 1 0 0 1 .7 1.2l-2.6 10" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">Library</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">You</span>
    </button>
  </nav>
</div>
</x-dc>
</body>
</html>
