<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3c6449; text-decoration: none; } a:hover { color: #4a7c59; }
    .num { font-family: Newsreader, Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8378; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 0 18px; text-align: left; }
    .ico { width: 36px; height: 36px; border-radius: 12px; background: #f4f2ee; display: grid; place-items: center; flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #fbfaf8; color: #1c1a17; overflow: hidden;">
  <div style="height: 44px;"></div>

  <div style="padding: 0 20px;">
    <h1 style="margin: 20px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em;">Library</h1>
    <p style="margin: 6px 0 0; font-size: 13px; color: #8a8378;">The things you have taught the app</p>

    <!-- These four were scattered behind other screens: recipes had a tab,
         your foods and supplements were reached only from a search that had
         already failed, and vessels only from inside the weight field. -->
    <div style="background: #ffffff; border-radius: 20px; margin-top: 20px; overflow: hidden; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">

      <button class="row" style="border-bottom: 1px solid #f1eee8;">
        <span class="ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5A1.5 1.5 0 0 1 6.5 5H18v14H6.5A1.5 1.5 0 0 1 5 17.5z" /><path d="M9 9.5h5M9 13h5" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Recipes</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">Dishes you cook repeatedly</span>
        </span>
        <span class="num" style="font-size: 14px; color: #a89f92;">4</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button class="row" style="border-bottom: 1px solid #f1eee8;">
        <span class="ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2" /><path d="M8.5 8h7M8.5 12h7M8.5 16h4" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Your foods</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">Transcribed from a pack</span>
        </span>
        <span class="num" style="font-size: 14px; color: #a89f92;">12</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button class="row" style="border-bottom: 1px solid #f1eee8;">
        <span class="ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" /><path d="M12 8.5v7" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Supplements</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">Taken by count, not by weight</span>
        </span>
        <span class="num" style="font-size: 14px; color: #a89f92;">3</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button class="row">
        <span class="ico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12l-1 9.5a2 2 0 0 1-2 1.8H9a2 2 0 0 1-2-1.8z" /><path d="M9.5 9V6.2A2.2 2.2 0 0 1 11.7 4h.6a2.2 2.2 0 0 1 2.2 2.2V9" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Vessels</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">Weighed empty once, so a plate can go on the scale</span>
        </span>
        <span class="num" style="font-size: 14px; color: #a89f92;">5</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <div class="cap" style="margin-top: 26px;">Reference data</div>
    <div style="background: #ffffff; border-radius: 20px; margin-top: 10px; padding: 18px; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span class="num" style="font-size: 26px; font-weight: 500;">13,694</span>
        <span style="font-size: 13px; color: #8a8378;">foods bundled</span>
      </div>
      <p style="margin: 8px 0 0; font-size: 12.5px; color: #8a8378; line-height: 1.6;">
        USDA Foundation, SR Legacy and FNDDS, with Indian-name aliases so
        <em style="color: #57524a;">urad dal</em> finds the right entry.
      </p>
    </div>
  </div>

  <button style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 999px; background: #4a7c59; color: #ffffff; display: grid; place-items: center; box-shadow: 0 4px 14px -2px rgba(74,124,89,0.45), 0 2px 4px rgba(28,26,23,0.10);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); border-top: 1px solid #e8e4dd; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 18px;">
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">Today</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">Nutrients</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 9.5h17M8 3v4M16 3v4" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">History</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #3c6449;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; background: #edf3ee;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z" /><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9" /><path d="M18 7l2.4.6a1 1 0 0 1 .7 1.2l-2.6 10" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 600;">Library</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg></span>
      <span style="font-size: 10.5px; font-weight: 500;">You</span>
    </button>
  </nav>
</div>
</x-dc>
</body>
</html>
