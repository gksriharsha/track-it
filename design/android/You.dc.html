<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3c6449; text-decoration: none; } a:hover { color: #4a7c59; }
    .num { font-family: Newsreader, Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8378; font-weight: 600; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #fbfaf8; color: #1c1a17; overflow: hidden;">

  <div style="height: 44px;"></div>

  <div style="padding: 0 20px;">
    <h1 style="margin: 20px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em;">You</h1>
    <p style="margin: 6px 0 0; font-size: 13px; color: #8a8378;">Who the targets are for</p>

    <!-- Identity. A soft accent wash, never a solid black disc — the old
         header icon inverted to pure black on the active screen, which is
         what made it read as a blot rather than a control. -->
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 24px;">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: #edf3ee; display: grid; place-items: center; flex: none;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4a7c59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg>
      </span>
      <span style="min-width: 0;">
        <span style="display: block; font-size: 17px; font-weight: 600;">Males 31–50 years</span>
        <span style="display: block; font-size: 13px; color: #8a8378; margin-top: 1px;">Born 1990 · 175 cm · 70 kg</span>
      </span>
    </div>

    <!-- What the profile currently buys, as two plain state rows. -->
    <div style="background: #ffffff; border-radius: 20px; padding: 4px 18px; margin-top: 22px; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">

      <div style="display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid #f1eee8;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14px; font-weight: 500;">Nutrient targets</span>
          <span style="display: block; font-size: 12px; color: #8a8378; margin-top: 2px;">Read against the DRIs for your group</span>
        </span>
        <span style="font-size: 11px; font-weight: 600; color: #3c6449; background: #edf3ee; border-radius: 999px; padding: 4px 10px; white-space: nowrap;">Personalised</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 16px 0;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14px; font-weight: 500;">Energy target</span>
          <span style="display: block; font-size: 12px; color: #8a8378; margin-top: 2px;">About 2,500 kcal, estimated from your body</span>
        </span>
        <span style="font-size: 11px; font-weight: 600; color: #57524a; background: #f4f2ee; border-radius: 999px; padding: 4px 10px; white-space: nowrap;">Estimated</span>
      </div>
    </div>

    <!-- Navigation as rows. Every one of these was an underlined link in the
         old screen; a row with a chevron says "this goes somewhere" without
         borrowing the web's vocabulary. -->
    <div class="cap" style="margin-top: 26px;">Settings</div>

    <div style="background: #ffffff; border-radius: 20px; margin-top: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 0 18px; text-align: left; border-bottom: 1px solid #f1eee8;">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #f4f2ee; display: grid; place-items: center; flex: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Profile</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">Age, body, life stage</span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 0 18px; text-align: left; border-bottom: 1px solid #f1eee8;">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #f4f2ee; display: grid; place-items: center; flex: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="2.6" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Targets &amp; goals</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">What every percentage is measured against</span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 0 18px; text-align: left;">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #f4f2ee; display: grid; place-items: center; flex: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#57524a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11" /><path d="M8 10.5l4 4 4-4" /><path d="M4.5 17.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2" /></svg>
        </span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Import a spreadsheet</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">Bring in a log you kept elsewhere</span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <p style="margin: 22px 4px 0; font-size: 12px; color: #a89f92; line-height: 1.6;">
      Everything stays on this device, in the same file as your food log.
    </p>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); border-top: 1px solid #e8e4dd; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 18px;">
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
      </span>
      <span style="font-size: 10.5px; font-weight: 500;">Today</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7" /></svg>
      </span>
      <span style="font-size: 10.5px; font-weight: 500;">Nutrients</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 9.5h17M8 3v4M16 3v4" /></svg>
      </span>
      <span style="font-size: 10.5px; font-weight: 500;">History</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #8a8378;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z" /><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9" /><path d="M18 7l2.4.6a1 1 0 0 1 .7 1.2l-2.6 10" /></svg>
      </span>
      <span style="font-size: 10.5px; font-weight: 500;">Library</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 6px; color: #3c6449;">
      <span style="display: grid; place-items: center; width: 44px; height: 26px; border-radius: 999px; background: #edf3ee;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg>
      </span>
      <span style="font-size: 10.5px; font-weight: 600;">You</span>
    </button>
  </nav>
</div>
</x-dc>
</body>
</html>
