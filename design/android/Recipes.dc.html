<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3c6449; text-decoration: none; } a:hover { color: #4a7c59; }
    .num { font-family: Newsreader, Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8378; font-weight: 600; }
    .card { background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10); }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 0 18px; text-align: left; }
    .sep { border-bottom: 1px solid #f1eee8; }
    .note { font-size: 12px; color: #8a8378; line-height: 1.6; }
    .add { min-height: 44px; padding: 0 16px; border-radius: 999px; background: #4a7c59; color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
    .del { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: #b4553a; flex: none; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #fbfaf8; color: #1c1a17;">
  <div style="height: 44px;"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 0;">
    <button style="width: 40px; height: 40px; border-radius: 999px; background: #f4f2ee; display: grid; place-items: center; color: #57524a; flex: none;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <span style="font-size: 19px; font-weight: 600; letter-spacing: -0.015em; flex: 1;">Recipes</span>
    <button class="add"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>New</button>
  </div>
  <div style="padding: 0 20px 40px;">
    <p class="note" style="margin: 14px 2px 0;">
      Stored as ingredients over a yield, not as a nutrient snapshot — which is what lets a dish
      show what went into it, and keeps its gaps honest.
    </p>

    <div class="card" style="margin-top: 16px;">
      <button class="row sep">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Rajma chawal</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">3 ingredients · 303 g a serving · North Indian</span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
        <span class="del"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg></span>
      </button>
      <button class="row sep">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Sambar</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">2 ingredients · 150 g a serving · South Indian</span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
        <span class="del"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg></span>
      </button>
      <button class="row">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Poha</span>
          <span style="display: block; font-size: 12px; color: #8a8378;">5 ingredients · 180 g a serving</span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
        <span class="del"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg></span>
      </button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
