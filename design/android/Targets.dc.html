<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    body { margin: 0; font: 15px/1.55 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3c6449; text-decoration: none; } a:hover { color: #4a7c59; }
    .num { font-family: Newsreader, Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8378; font-weight: 600; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #fbfaf8; color: #1c1a17; overflow: hidden;">

  <div style="height: 44px;"></div>

  <!-- App bar. Back is a 44px icon button on a soft ground, not the words
       "‹ back" underlined in green. -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 0;">
    <button style="width: 40px; height: 40px; border-radius: 999px; background: #f4f2ee; display: grid; place-items: center; color: #57524a; flex: none;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <span style="min-width: 0;">
      <span style="display: block; font-size: 19px; font-weight: 600; letter-spacing: -0.015em;">Targets &amp; goals</span>
    </span>
  </div>

  <div style="padding: 0 20px;">

    <!-- Where the numbers come from, with the edit affordance as a real
         outlined button instead of an inline link. -->
    <div style="background: #ffffff; border-radius: 20px; padding: 18px; margin-top: 20px; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600; flex: 1;">Where your targets come from</h2>
        <button style="font-size: 12px; font-weight: 600; color: #3c6449; border: 1px solid #d6e0d8; border-radius: 999px; padding: 7px 14px; background: #ffffff; white-space: nowrap;">Edit</button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0 0;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14px;">Reference tables</span>
          <span style="display: block; font-size: 12px; color: #8a8378; margin-top: 1px;">Males 31–50 years</span>
        </span>
        <span style="font-size: 11px; font-weight: 600; color: #3c6449; background: #edf3ee; border-radius: 999px; padding: 4px 10px;">DRI</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0 0; border-top: 1px solid #f1eee8; margin-top: 14px;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14px;">Energy</span>
          <span style="display: block; font-size: 12px; color: #8a8378; margin-top: 1px;">About 2,500 kcal, estimated</span>
        </span>
        <span style="font-size: 11px; font-weight: 600; color: #57524a; background: #f4f2ee; border-radius: 999px; padding: 4px 10px;">Estimated</span>
      </div>
    </div>

    <!-- Filters as a segmented control: one control, three states, rather
         than three loose pills that each look independently pressable. -->
    <div style="display: flex; background: #f0ede7; border-radius: 999px; padding: 3px; margin-top: 22px;">
      <button style="flex: 1; min-height: 36px; border-radius: 999px; background: #ffffff; color: #1c1a17; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(28,26,23,0.06);">All</button>
      <button style="flex: 1; min-height: 36px; border-radius: 999px; color: #8a8378; font-size: 13px; font-weight: 500;">Mine</button>
      <button style="flex: 1; min-height: 36px; border-radius: 999px; color: #8a8378; font-size: 13px; font-weight: 500;">Limits</button>
    </div>

    <div style="background: #ffffff; border-radius: 20px; margin-top: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(28,26,23,0.04), 0 8px 24px -12px rgba(28,26,23,0.10);">

      <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 0 18px; text-align: left; border-bottom: 1px solid #f1eee8;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Iron</span>
          <span style="display: block; font-size: 11.5px; color: #8a8378; margin-top: 1px;">RDA</span>
        </span>
        <span class="num" style="font-size: 16px; font-weight: 500;">8.0 mg</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 0 18px; text-align: left; border-bottom: 1px solid #f1eee8;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Folate</span>
          <span style="display: block; font-size: 11.5px; color: #8a8378; margin-top: 1px;">RDA</span>
        </span>
        <span class="num" style="font-size: 16px; font-weight: 500;">400 µg</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <!-- A target the user set. Marked by an accent bar and a quiet chip,
           not by a colour-only difference. -->
      <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 0 18px 0 15px; text-align: left; border-bottom: 1px solid #f1eee8; border-left: 3px solid #4a7c59; background: #fcfdfc;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: flex; align-items: center; gap: 7px;">
            <span style="font-size: 15px;">Vitamin D</span>
            <span style="font-size: 10px; font-weight: 600; color: #3c6449; background: #edf3ee; border-radius: 999px; padding: 2px 7px;">YOURS</span>
          </span>
          <span style="display: block; font-size: 11.5px; color: #8a8378; margin-top: 1px;">Was 15 µg, the RDA</span>
        </span>
        <span class="num" style="font-size: 16px; font-weight: 500;">50 µg</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 0 18px; text-align: left; border-bottom: 1px solid #f1eee8;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: flex; align-items: center; gap: 7px;">
            <span style="font-size: 15px;">Sodium</span>
            <span style="font-size: 10px; font-weight: 600; color: #a2563c; background: #f8ede9; border-radius: 999px; padding: 2px 7px;">LIMIT</span>
          </span>
          <span style="display: block; font-size: 11.5px; color: #8a8378; margin-top: 1px;">Daily Value</span>
        </span>
        <span class="num" style="font-size: 16px; font-weight: 500;">2,300 mg</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 0 18px; text-align: left;">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 15px;">Fibre</span>
          <span style="display: block; font-size: 11.5px; color: #8a8378; margin-top: 1px;">Adequate intake</span>
        </span>
        <span class="num" style="font-size: 16px; font-weight: 500;">38 g</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <p style="margin: 18px 4px 0; font-size: 12px; color: #a89f92; line-height: 1.6;">
      A figure you set beats both reference tables. Nothing here changes a day you already logged.
    </p>
  </div>
</div>
</x-dc>
</body>
</html>
