[package]
name = "trackit"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trackit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
trackit-core = { path = "../crates/core" }
# `bundled` compiles SQLite from source, so FTS5 is guaranteed present and the
# Android build does not depend on whatever libsqlite3 the device happens to ship.
#
# `backup` and `serialize` are what let a sealed copy be taken without ever
# writing a plaintext database to disk: the online-backup API copies the live
# pages into a memory database and `serialize` hands back its bytes. Both are
# pure feature flags on rusqlite — `backup = []`, `serialize = []` — so nothing
# new is downloaded for them.
rusqlite = { version = "0.40", features = ["bundled", "backup", "serialize"] }
# Needed on Android: resource_dir() is "asset://localhost/", not a filesystem
# path, so the bundled database must be read through the asset manager.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Household sync speaks Noise over plain TCP. `default-features = false` is
# load-bearing rather than tidy: snow's `std` feature enables `ring/std`
# written WITHOUT a `?`, so the defaults drag ring and aes-gcm in — 57 packages
# resolved instead of 35, and a C toolchain on every Android ABI. Without them
# snow is pure Rust and all four Android targets link with nothing but the NDK
# linker. The cost is that snow becomes `no_std`, which is why every call site
# here uses `.map_err(|e| e.to_string())` rather than any boxed-error path:
# `snow::Error` implements `core::error::Error`, not `std::error::Error`.
snow = { version = "0.10.0", default-features = false, features = [
  "default-resolver", "use-chacha20poly1305", "use-blake2",
  "use-sha2", "use-curve25519", "use-getrandom" ] }
# The nonce in a rendezvous probe. A direct dependency, at the version snow
# already compiles, rather than a reach through snow's own tree: a nonce that
# an eavesdropper can predict is a probe they can replay to make a device
# announce the port it answers on.
getrandom = "0.3"
# The six-digit comparison is SHA256 over the handshake hash. sha2 reaches the
# tree today only through tauri-codegen, which is a host-only proc-macro, so it
# has to be a direct dependency to exist on a phone at all.
sha2 = "0.10"
# Every non-loopback IPv4 this device has, for the pairing payload and for the
# rendezvous sweep. libc `getifaddrs`, which bionic has had since API 24.
if-addrs = "0.14.0"
# Drawing the pairing code. Zero dependencies, and it happens in Rust beside
# the key material so the payload is never assembled twice in two languages.
qrcodegen = "1.8.0"

# The sealed backup artifact — see `backup.rs` and docs/decisions.md D18.
#
# All four are the same code on both platforms, deliberately NOT target-gated:
# the blob format and its tests have to build and run on the developer's Mac,
# because a format nobody can exercise without a phone in hand is a format
# nobody exercises. What IS Android-only is the SQLCipher block below and the
# Keystore bridge, and the latter is Kotlin.
#
# `zeroize` is in argon2's feature list on purpose. It is declared there as an
# OPTIONAL dependency and neither `default` nor `alloc` turns it on, so without
# this line the 64 MiB memory-hard block Argon2id fills with material derived
# from the user's passphrase would be handed back to the allocator unwiped.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.10"
# An AEAD ciphertext is incompressible, so Google's own compression of the
# backup set does nothing for us; compressing BEFORE sealing is what keeps the
# artifact under the 25 MB Auto Backup quota. `rust_backend` rather than the
# default zlib C shim, so this adds no C to the Android cross-build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zeroize = { version = "1", features = ["alloc"] }

# The debug Android APK is the reason this block exists. Cargo's default dev
# profile is `debug = 2`, which left 133 MB of DWARF in libtrackit_lib.so — 80%
# of a 188 MB APK — and the generated Gradle file adds
# `jniLibs.keepDebugSymbols` for arm64, so AGP does not strip it back out. The
# result filled the emulator's /data partition and `adb install` began failing
# with INSTALL_FAILED_INSUFFICIENT_STORAGE.
#
# `debug = 1` keeps line tables, so a panic still names a file and a line on
# desktop; what goes is the type and variable information a step debugger uses.
# That is the right trade for a profile whose main consumer is a phone.
[profile.dev]
debug = 1

# Mobile release packages should contain executable code, not the symbol and
# per-codegen-unit baggage useful to a debugger. LTO also lets the linker drop
# Rust paths that this particular target never calls (including platform-gated
# branches), while `s` keeps the remaining machine code compact.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# SQLCipher, and ONLY on Android. See docs/decisions.md D18.
#
# Cargo's v2 feature resolver — implied by edition 2021, so no `resolver` line
# is needed and src-tauri is a standalone package with no workspace root — does
# the per-target resolution, and it was confirmed empirically rather than
# assumed: a macOS build of this manifest compiles zero openssl and zero
# sqlcipher symbols, an aarch64-linux-android build compiles 87 of the latter,
# and rebuilding macOS straight afterwards is a no-op rather than a cache
# ping-pong between the two targets.
#
# The one thing that would have made this expensive is not true: an UNKEYED
# SQLCipher connection still opens a plaintext file, magic bytes and all, so
# `db.rs` needs no change to keep reading the bundled 39 MB reference database
# with FTS5 intact. SQLCipher only engages its codec once a key is set, and the
# only thing that ever takes a key here is the user's own log.
#
# The cost is +3.79 MB on the one ABI the release workflow actually ships, and
# a standing obligation to watch OpenSSL advisories — vendored OpenSSL is
# security-critical C in a build that otherwise has none.
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "backup", "serialize"] }

# Apple Vision reads the nutrition panel on device — nothing is uploaded. The
# feature sets are pared to what still-image text recognition actually touches,
# so a label scan does not drag CoreML, AVFoundation and CoreMedia into the
# build. Versions match what tauri already pins in Cargo.lock (objc2 0.6.4, the
# framework crates 0.3.2) so the graph stays on one copy of each.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString", "objc2"] }
# ImageIO decodes the encoded bytes and, just as importantly, tells us the EXIF
# orientation: a panel photographed in portrait arrives rotated, and Vision
# reads nothing at all from sideways text.
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2", "objc2-core-graphics"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNDefines", "VNError", "VNTypes", "VNObservation", "VNRequest", "VNRequestHandler", "VNRequestRevisionProviding", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "objc2-core-foundation", "objc2-core-graphics", "objc2-image-io"] }

# The save panel the desktop build puts an export in front of, and nothing
# else. Deliberately scoped to everything EXCEPT the phones rather than sitting
# in `[dependencies]`: this plugin ships an Android AAR, and the Tauri CLI
# discovers those from the Cargo graph and writes them into
# `gen/android/tauri.settings.gradle`, a generated and gitignored file that
# nobody should have to hand-maintain. Android does not want it in any case —
# saving there goes through the Storage Access Framework, which `ExportPlugin.kt`
# asks for directly and rfd cannot reach.
#
# Pinned rather than left as "2". The published 2.7.1 crate declares a
# `consumerProguardFiles("consumer-rules.pro")` whose file is missing from the
# package, so a range that ever resolved backwards would fail an Android build
# that had no business seeing this plugin at all. 2.7.3 is also the version
# docs/architecture-app.md §5.1 already names.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2.7.3"
