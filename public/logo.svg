<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The outer edge is one true circle (r 13.5); the weight grows inward, so
       the width step reads as a shoulder and the silhouette never breaks.
       Butt caps: on a circular arc a butt cap is radial, so both caps meet on
       the same radius line. -->
  <path d="M 16 5 A 11 11 0 1 1 6.474 21.5" fill="none" stroke="#4a7c59" stroke-width="5" stroke-linecap="butt"/>
  <path d="M 5.261 22.2 A 12.4 12.4 0 0 1 16 3.6" fill="none" stroke="#4a7c59" stroke-width="2.2" stroke-linecap="butt"/>
</svg>
